[project]
name = "opencode-gui"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.11.0",
    "markdown>=3.10.2",
]

[project.scripts]
opencode-gui = "main:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML template strings in f-strings cannot be wrapped — E501 is expected
"ui/main_window.py" = ["E501"]
